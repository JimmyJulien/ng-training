<div class="grid gap-6">
  <p>Are you sure ?</p>

  <div class="flex justify-end gap-4">
    <p-button
      icon="pi pi-times"
      label="No"
      severity="danger"
      size="small"
      variant="outlined"
      (click)="close(false)"
    />
    <p-button
      icon="pi pi-check"
      label="Yes"
      severity="danger"
      size="small"
      (click)="close(true)"
    />
  </div>
</div>
